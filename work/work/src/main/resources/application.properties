spring.application.name=work

# Local dev: H2. Trong Docker: DBMS_CONNECTION=jdbc:mysql://mysql:3306/gummysylic
spring.datasource.url=${DBMS_CONNECTION:jdbc:h2:mem:gummysylic}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# API key protecting this backend (empty = auth disabled for local dev)
app.security.api-key=${API_KEY:}

# AI provider: poolside (default, via OpenRouter) or gemini
ai.provider=${AI_PROVIDER:poolside}

# OpenRouter (Poolside free tier) — never hardcode the key here
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.model=${OPENROUTER_MODEL:poolside/laguna-xs-2.1:free}
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.app-name=Savora
openrouter.app-url=https://example.com

# Gemini (optional fallback provider)
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-2.0-flash
gemini.base-url=https://generativelanguage.googleapis.com

